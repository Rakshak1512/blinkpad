<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline – BlinkPad</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B091B;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(30, 27, 75, 0.4);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      margin-bottom: 24px;
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.5);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #FFFFFF, #DDD6FE);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 14px;
      color: #94A3B8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #7C3AED;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      padding: 14px 20px;
      border-radius: 16px;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
      cursor: pointer;
      border: none;
    }
    .btn:hover { background: #6D28D9; }
    .btn:active { transform: scale(0.98); }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #FBBF24;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/pwa-192x192.png" alt="BlinkPad" class="logo">
    <div class="badge">
      <span>● Offline Mode Active</span>
    </div>
    <h1>You're Currently Offline</h1>
    <p>
      No internet connection detected. BlinkPad local storage is still available — your drafts and local pads are kept safe in IndexedDB and will auto-sync once your connection returns.
    </p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
